<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
</head>
<body>
  <h1>Weather App</h1>

  <form id="search-form">
    <label for="city-input">City name</label>
    <input
      type="text"
      id="city-input"
      name="city-input"
      maxlength="100"
      placeholder="Enter a US city name"
      autocomplete="off"
    >
    <button type="submit" id="search-button">Get Weather</button>
  </form>

  <button type="button" id="unit-toggle" aria-pressed="false">Show °C</button>

  <div id="status" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
